name: Build Linux app

# GlyphViz is developed on Windows, so this workflow is how a Linux build gets
# produced at all — same reasoning as build-macos.yml. Two artifacts come out
# of one build: a .tar.gz (extract and run) and a .AppImage (chmod +x and run,
# no extraction, no install).
#
# Run it from the Actions tab (Run workflow), or push a v* tag to build and
# attach both to that release.

on:
  workflow_dispatch:
    inputs:
      pyside:
        description: >-
          PySide6 version spec. Left at pyproject.toml's own floor (>=6.6.0)
          by default — unlike the macOS build, there's no verified mapping
          here yet from a PySide6 series to a manylinux/glibc floor, so
          nothing is pinned speculatively. Override here if a specific series
          turns out to matter.
        default: ''
        type: string
      aarch64:
        description: >-
          Also build an ARM64 (aarch64) Linux artifact. Off by default: unlike
          macos-15 / ubuntu-22.04, GitHub's arm64 Ubuntu runners are not
          confirmed free-tier for a private repo as of this writing — check
          current runner pricing before turning this on.
        default: false
        type: boolean
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Same conditional-matrix trick as build-macos.yml (job-level `if`
        # can't see the matrix context). ubuntu-22.04, not -latest: an older
        # LTS runner keeps the build's glibc floor lower — see
        # GlyphViz-Linux.spec's header comment. Tag pushes have no inputs, so
        # they build x86_64 only.
        include: ${{ inputs.aarch64 == true
          && fromJSON('[{"runner":"ubuntu-22.04","arch":"x86_64"},{"runner":"ubuntu-22.04-arm","arch":"aarch64"}]')
          || fromJSON('[{"runner":"ubuntu-22.04","arch":"x86_64"}]') }}

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system libraries
        # A GitHub-hosted Ubuntu runner has no display stack at all. These are
        # the shared libraries PySide6's Qt binaries dlopen at import time even
        # for --version/--check, which don't touch a display — without them
        # PyInstaller's own analysis step (which imports PySide6 to introspect
        # it) fails before a single frame is built. libgl1 covers the actual
        # renderer; it's not what GlyphViz ships (see the spec's comment on
        # relying on the host's own driver), it's what lets THIS step import
        # OpenGL/PySide6.QtOpenGL at all.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          if [ -n "${{ inputs.pyside }}" ]; then
            python -m pip install "${{ inputs.pyside }}"
          fi
          python -m pip install -e ".[build]"
          python -c "import PySide6, sys; print('PySide6', PySide6.__version__, 'on', sys.version)"

      - name: Build GlyphViz
        run: python -m PyInstaller GlyphViz-Linux.spec --clean -y

      - name: Smoke test
        run: |
          BIN=dist/GlyphViz/GlyphViz
          # --version doesn't touch Qt/GL, so it's a fair gate on a headless
          # runner: if it fails, the bundle is genuinely broken.
          "$BIN" --version
          # --check needs a GL context, which a headless CI runner may not
          # have (no GPU, no Xvfb). Report it, never fail the build on it.
          "$BIN" --check || echo "(--check failed; expected on a headless runner with no GL driver)"

      - name: Package
        id: package
        run: |
          VERSION=$(python -c "from glyphviz_core import __version__; print(__version__)")
          NAME="GlyphViz-${VERSION}-Linux-${{ matrix.arch }}"

          tar -czf "${NAME}.tar.gz" -C dist GlyphViz

          curl -fL -o appimagetool.AppImage \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x appimagetool.AppImage

          mkdir -p AppDir/usr/bin
          cp -a dist/GlyphViz AppDir/usr/bin/GlyphViz
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/GlyphViz/GlyphViz" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/glyphviz.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=GlyphViz
          Comment=3D node-graph visualizer for ANTz/GaiaViz-style CSV scene data
          Exec=GlyphViz
          Icon=glyphviz
          Categories=Graphics;Science;Viewer;
          Terminal=false
          EOF
          cp glyphviz-docs/docs/assets/brand/favicon-180.png AppDir/glyphviz.png

          # No FUSE on a GitHub-hosted runner; extract-and-run is appimagetool's
          # own fallback for exactly that.
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage AppDir "${NAME}.AppImage"
          chmod +x "${NAME}.AppImage"

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.AppImage
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.AppImage
