site_name: GlyphViz
site_description: A 3D hierarchical visualization toolkit for hyperdimensional data, built on the ANTz lineage.
site_url: https://www.iluvdata.org/glyphviz/
site_dir: C:/Jeff/iluvdata/public_html/glyphviz-docs-site-preview

extra_css:
  - stylesheets/brand.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
  - https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js
  - javascripts/hero-scene.js
  - javascripts/carousel.js

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/glyphviz-mark.svg
  favicon: assets/brand/favicon-48.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

# Material theme is responsive/mobile-friendly by default (hamburger nav on small viewports)

plugins:
  - search

# Google Analytics (GA4). Emitted by the theme into <head> on every generated page.
# Using the theme's own integration rather than a hand-pasted gtag snippet because
# navigation.instant swaps pages via XHR: a raw snippet only ever registers one
# pageview per full browser load, while this hooks the theme's location$ stream and
# sends a page_path config on every in-site navigation (plus search-term events).
extra:
  analytics:
    provider: google
    property: G-Q0G8ECKDFZ

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

